:1.65}.timeline{border-left:2px solid #d7e1d8;margin:22px 0 10px 12px;padding-left:22px}.item{position:relative;padding:0 0 23px}.item:before{content:"";position:absolute;left:-29px;top:5px;background:var(--accent);width:11px;height:11px;border-radius:50%;border:2px solid #fff}.time{font-weight:750;color:var(--green);font-size:14px}.item h3{margin:5px 0 5px;font-size:17px}.item p{margin:0 0 9px;white-space:pre-wrap;color:#5c6660;line-height:1.6;font-size:14px}.itemactions{display:flex;gap:7px;flex-wrap:wrap}.link{font-size:12px;color:#365e55;text-decoration:none;border:1px solid #d8e3dd;padding:5px 9px;border-radius:7px;background:#f8faf8}.link:hover{background:#e8f1ec}.empty{padding:32px;text-align:center;color:var(--muted);background:#faf9f6;border:1px dashed var(--line);border-radius:12px;margin-top:20px}.booking{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}.booking h3{margin:0 0 12px}.bookrow{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;border-bottom:1px solid #f0eee8;padding:10px 0;font-size:14px}.bookrow small{display:block;color:var(--muted);margin-top:3px}.status{border-radius:20px;padding:6px 8px;font-size:12px;background:#fff3dd;color:#8d6427}.status.done{background:#e7f4eb;color:#246947}.muted{color:var(--muted)}dialog{border:0;border-radius:17px;box-shadow:0 24px 100px #0005;width:min(520px,calc(100vw - 30px));padding:23px}dialog::backdrop{background:#0a1918a0}dialog h2{margin:0 0 17px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #d8ddd7;border-radius:9px;padding:10px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.footer{font-size:12px;color:var(--muted);margin-top:20px;line-height:1.7}@media(max-width:720px){header{padding:33px 20px}.wrap{padding:16px 12px 55px}.layout{display:block}.sidebar{position:static;display:flex;overflow-x:auto;gap:7px;margin-bottom:14px;padding:9px}.sidebar h3{display:none}.daytab{min-width:104px;margin:0;text-align:center;padding:11px 9px}.panel{padding:18px}.bookrow{grid-template-columns:1fr auto}.bookrow button:last-child{grid-column:2}}

<header><div class="eyebrow">PRIVATE TRIP PLANNER</div><h1>京都・大阪自由行</h1><p>只有受邀團員登入後可查看與編輯</p></header>
<main class="wrap"><section class="panel authPanel"><h2>團員登入</h2><p role="status" aria-live="polite" id="status">準備登入中…</p><p class="uid" id="uid"></p><div class="toolbar"><button class="btn primary" id="signIn" hidden>使用 Google 登入</button><button class="btn" id="signOut" hidden>登出</button></div></section>
<div id="privateApp" hidden><div class="toolbar"><button class="btn primary" id="addItem">＋ 新增行程</button><button class="btn foodButton" id="addRestaurant">🍴 新增餐廳</button><button class="btn" id="addBooking">＋ 新增預約</button><button class="btn" id="export">↓ 匯出共用備份</button><button class="btn" id="setupImport">↑ 匯入私人旅程設定</button><button class="btn" id="dataImport">↑ 匯入／還原行程備份</button><input type="file" id="setupFile" accept="application/json" hidden><input type="file" id="dataFile" accept="application/json" hidden></div>
<div class="setup" id="setupNotice" hidden>尚無旅程設定。請先匯入私人旅程設定檔，再匯入從原版網頁匯出的 JSON 備份。匯入備份會取代目前共用行程，請先匯出備份。</div>
<div class="layout" id="tripPanel" hidden><nav class="sidebar" id="days" aria-label="每日行程"></nav><section class="panel"><div class="heading"><div><h2 id="dayTitle"></h2><p class="sub" id="dayDate"></p></div><span class="pill" id="count"></span></div><div class="note" id="dayNote"></div><div class="categoryLegend" aria-label="行程分類"><span><i class="legendDot" aria-hidden="true"></i>📍 景點／活動</span><span><i class="legendDot food" aria-hidden="true"></i>🍴 美食／餐廳</span></div><div class="timeline" id="timeline"></div><section class="booking"><div class="heading"><h3>預約與票券</h3><span class="pill" id="bookingCount"></span></div><div id="bookings"></div></section><div class="footer">行程與預約儲存在團員專用的 Firestore 資料庫，登入後會同步。請定期匯出 JSON 備份。</div></section></div></div></main>
<dialog id="editDialog"><form id="editForm"><h2 id="editHeading">編輯行程</h2><input type="hidden" id="editId"><input type="hidden" id="editRev"><label for="itemDay">日期</label><select id="itemDay"></select><label for="itemCategory">分類</label><select id="itemCategory"><option value="sight">📍 景點／活動</option><option value="food">🍴 美食／餐廳</option></select><label for="itemTime">時間（例如 11:20 或 下午）</label><input id="itemTime" maxlength="30" placeholder="待定"><label for="itemTitle">景點／活動／餐廳名稱 *</label><input id="itemTitle" required maxlength="100"><label for="itemLocation">地點或 Google Maps 連結</label><input id="itemLocation" maxlength="2048" placeholder="輸入地點，或貼上 Google Maps 分享連結"><label for="itemDesc">備註</label><textarea id="itemDesc" maxlength="5000"></textarea><div class="formactions"><button class="btn" type="button" data-close="editDialog">取消</button><button class="btn primary" type="submit">儲存</button></div></form></dialog>
<dialog id="bookingDialog"><form id="bookingForm"><h2 id="bookingHeading">編輯預約</h2><input type="hidden" id="bookingId"><input type="hidden" id="bookingRev"><label for="bookingDay">日期</label><select id="bookingDay"></select><label for="bookingTitle">預約項目 *</label><input id="bookingTitle" required maxlength="100"><label for="bookingStatus">狀態</label><select id="bookingStatus"><option value="待確認">待確認</option><option value="尚未預約">尚未預約</option><option value="已預約">已預約</option><option value="不需預約">不需預約</option></select><label for="bookingUrl">官方／預約網址（選填）</label><input type="url" maxlength="2048" id="bookingUrl" placeholder="https://..."><label for="bookingNote">備註／訂位編號（選填）</label><textarea id="bookingNote" maxlength="5000"></textarea><div class="formactions"><button class="btn" type="button" data-close="bookingDialog">取消</button><button class="btn primary" type="submit">儲存</button></div></form></dialog>
<script type="module">let initializeApp,getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged;
let getFirestore,doc,collection,getDoc,onSnapshot,runTransaction,writeBatch;

// Paste the public Firebase web app configuration here after creating the project.
const firebaseConfig={apiKey:'AIzaSyDajGANMfCeMPXt1q2YjStgOi-1YfmM0U8',authDomain:'kyoto-osaka-trip-60ea1.firebaseapp.com',projectId:'kyoto-osaka-trip-60ea1',storageBucket:'kyoto-osaka-trip-60ea1.firebasestorage.app',messagingSenderId:'255770398282',appId:'1:255770398282:web:310c5ec51129a00cdaa0b3'};
const trip='trips/trip-1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=value=>{try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
function directMapUrl(value){
  const input=String(value??'').trim();
  const candidate=/^https?:\/\//i.test(input)?input:/^(?:www\.|maps\.|google\.|goo\.)/i.test(input)?'https://'+input:'';
  if(!candidate)return '';
  try{const u=new URL(candidate),h=u.hostname.toLowerCase();const google=/^(?:www\.)?google\.(?:com|com\.[a-z]{2}|co\.[a-z]{2}|[a-z]{2})$/.test(h);if(!((google&&u.pathname.startsWith('/maps'))||h==='maps.google.com'||h==='maps.app.goo.gl'||(h==='goo.gl'&&u.pathname.startsWith('/maps/'))))return '';u.protocol='https:';return u.href}catch{return ''}
}
const looksLikeUrl=v=>/^(?:[a-z][a-z\d+.-]*:|(?:www\.|maps\.|google\.|goo\.)\S*\/)/i.test(String(v??'').trim());
const mapUrl=v=>{const s=String(v??'').trim();return !s?'':directMapUrl(s)||(looksLikeUrl(s)?'':'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s))};
const order=v=>{const m=String(v??'').trim().match(/^(?:約\s*)?(\d{1,2}):([0-5]\d)/);if(m&&Number(m[1])<24)return Number(m[1])*60+Number(m[2]);return {清晨:300,早上:480,上午:540,中午:720,下午:900,傍晚:1020,晚上:1140}[v]??Infinity};
const clone=v=>JSON.parse(JSON.stringify(v));
const download=(data,name)=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
let auth,db,meta=null,items=[],bookings=[],active=0,unsubs=[],memberUnsub=null,canEdit=false,session=0;
function status(s){$('status').textContent=s}
function clearListeners(){unsubs.forEach(f=>f());unsubs=[];meta=null;items=[];bookings=[];canEdit=false;$('privateApp').hidden=true;for(const id of ['timeline','bookings','days','dayTitle','dayDate','dayNote'])$(id).textContent='';for(const id of ['timeline','bookings','days','dayTitle','dayDate','dayNote'])$(id).textContent='';for(const id of ['editDialog','bookingDialog'])$(id).close()}
function fail(e){clearListeners();status('同步已停止：'+e.message+'。請重新登入並確認團員權限與 Firestore 規則。')}
function requireEdit(){if(!auth?.currentUser||!canEdit)throw Error('目前沒有編輯權限');if(!navigator.onLine)throw Error('目前離線，請連線後再儲存')}
function validMeta(m){return m&&['dates','titles','notes'].every(k=>Array.isArray(m[k])&&m[k].length===7&&m[k].every(v=>typeof v==='string'))&&m.dates.every(v=>/^\d{4}-\d{2}-\d{2}$/.test(v))}
// Legacy documents are classified for display only; no background migration or writes.
function itemCategory(x){if(['sight','food'].includes(x?.category))return x.category;return /星巴克|咖啡|抹茶|餐廳|早餐|午餐|晚餐|美食|拉麵|壽司|燒肉|居酒屋|甜點|餐館|小吃|starbucks|restaurant|cafe|café/i.test(x?.title||'')?'food':'sight'}
function validate(kind,x){if(kind==='items'&&x?.category!==undefined&&!['sight','food'].includes(x.category))throw Error('行程分類不正確');if(!x||!Number.isInteger(x.day)||x.day<0||x.day>=7||typeof x.title!=='string'||!x.title.trim()||x.title.length>100)throw Error('日期或名稱格式不正確');const fields=kind==='items'?{time:30,location:2048,desc:5000}:{url:2048,note:5000};for(const [k,n] of Object.entries(fields))if(typeof x[k]!=='string'||x[k].length>n)throw Error(k+' 欄位格式或長度不正確');if(kind==='bookings'&&!['待確認','尚未預約','已預約','不需預約'].includes(x.status))throw Error('預約狀態不正確')}
window.addEventListener('offline',()=>status('目前離線；暫停編輯，已顯示的資料可能不是最新版本。'));
window.addEventListener('online',()=>status('網路已恢復，正在同步。'));
const ready=Object.values(firebaseConfig).every(Boolean);
if(location.protocol==='file:'){status('請透過 localhost 或已授權的 HTTPS 網址開啟，Google 登入無法在直接開啟的本機 HTML 使用。')}
else if(!ready){status('尚未設定 Firebase。請先依設定說明完成專案與權限規則。');$('signIn').hidden=true}
else{
  try{
  const [appSdk,authSdk,storeSdk]=await Promise.all([
    import('https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js'),
    import('https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js'),
    import('https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js')
  ]);
  ({initializeApp}=appSdk);
  ({getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}=authSdk);
  ({getFirestore,doc,collection,getDoc,onSnapshot,runTransaction,writeBatch}=storeSdk);
  const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
  $('signIn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status('登入失敗：'+e.message)}};
  $('signOut').onclick=async()=>{try{await signOut(auth)}catch(e){status('登出失敗：'+e.message)}};
  onAuthStateChanged(auth,async user=>{
    const token=++session;memberUnsub?.();memberUnsub=null;
    clearListeners();$('uid').textContent='';$('signOut').hidden=!user;$('signIn').hidden=!!user;
    if(!user){status('請使用團員的 Google 帳號登入。');return}
    $('uid').textContent='你的 Firebase UID：'+user.uid;
    memberUnsub=onSnapshot(doc(db,'members',user.uid),membership=>{
      if(token!==session)return;
      clearListeners();
      if(!membership.exists()||membership.data().disabled===true){status('尚未獲授權或資格已停用。請將 UID 提供給管理者加入團員名單。');return}
      canEdit=['editor','owner'].includes(membership.data().role||'editor');
      status('已登入：'+(user.email||'團員')+(canEdit?'（可編輯）':'（僅檢視）'));
      $('privateApp').hidden=false;
      unsubs.push(onSnapshot(doc(db,trip,'meta','main'),s=>{meta=s.exists()?s.data():null;if(meta&&!validMeta(meta)){fail(Error('旅程設定格式不正確'));return}render()},fail));
      unsubs.push(onSnapshot(collection(db,trip,'items'),s=>{items=s.docs.map(d=>({...d.data(),id:d.id}));render()},fail));
      unsubs.push(onSnapshot(collection(db,trip,'bookings'),s=>{bookings=s.docs.map(d=>({...d.data(),id:d.id}));render()},fail));
    },fail);
  });
  }catch(e){status('無法載入 Firebase：'+e.message)}
}
function render(){
  const dates=meta?.dates||[];
  $('setupNotice').hidden=!!meta;
  $('tripPanel').hidden=!meta;
  $('addItem').disabled=!meta||!canEdit;$('addRestaurant').disabled=!meta||!canEdit;$('addBooking').disabled=!meta||!canEdit; $('setupImport').hidden=!canEdit||!!meta; $('dataImport').hidden=!canEdit;
  if(!meta)return;
  if(active>=dates.length)active=0;
  $('days').innerHTML='<h3>每日行程</h3>'+dates.map((d,i)=>`<button class="daytab ${i===active?'active':''}" data-day="${i}">Day ${i+1} · ${esc(d.slice(5).replace('-','/'))}<small>${esc(meta.titles?.[i]||'')}</small></button>`).join('');
  $('dayTitle').textContent=`Day ${active+1}｜${meta.titles?.[active]||''}`;
  $('dayDate').textContent=dates[active];$('dayNote').textContent=meta.notes?.[active]||'';
  const dayItems=items.filter(x=>x.day===active).sort((a,b)=>order(a.time)-order(b.time)||a.id.localeCompare(b.id));
  $('count').textContent=dayItems.length+' 項行程';
  $('timeline').innerHTML=dayItems.length?dayItems.map(x=>{const url=mapUrl(x.location),category=itemCategory(x);return `<article class="item ${category}"><div class="time">${esc(x.time||'待定')}</div><div class="itemHeading"><h3>${esc(x.title)}</h3><span class="categoryBadge">${category==='food'?'🍴 美食／餐廳':'📍 景點／活動'}</span></div><p>${esc(x.desc)}</p><div class="itemactions">${url?`<a class="link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">↗ 地圖導航</a>`:''}<button class="link" data-edit="${esc(x.id)}">編輯</button><button class="link" data-delete="${esc(x.id)}">刪除</button></div></article>`}).join(''):'<div class="empty">這天尚未安排。</div>';
  const bs=bookings.filter(x=>x.day===active);
  $('bookingCount').textContent=bs.length+' 項';
  $('bookings').innerHTML=bs.length?bs.map(b=>`<div class="bookrow"><div><strong>${esc(b.title)}</strong><small>${esc(b.note)} ${safeUrl(b.url)?`<a href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener noreferrer">開啟預約連結 ↗</a>`:''}</small></div><span class="status ${b.status==='已預約'?'done':''}">${esc(b.status)}</span><div><button class="link" data-bookedit="${esc(b.id)}">編輯</button> <button class="link" data-bookdelete="${esc(b.id)}">刪除</button></div></div>`).join(''):'<div class="empty">這天尚無預約記錄。</div>';
  document.querySelectorAll('[data-edit],[data-delete],[data-bookedit],[data-bookdelete]').forEach(b=>b.hidden=!canEdit);
}
function openItem(id,category='sight'){requireEdit();$('itemDay').innerHTML=meta.dates.map((d,i)=>'<option value="'+i+'">Day '+(i+1)+'｜'+esc(d)+'</option>').join('');const x=items.find(v=>v.id===id);$('itemCategory').value=x?itemCategory(x):category;$('editHeading').textContent=x?'編輯行程':category==='food'?'新增餐廳':'新增行程';$('editId').value=x?.id||'';$('editRev').value=x?.rev||'';$('itemDay').value=x?.day??active;$('itemTime').value=x?.time||'';$('itemTitle').value=x?.title||'';$('itemLocation').value=x?.location||'';$('itemDesc').value=x?.desc||'';$('editDialog').showModal()}
function openBooking(id){requireEdit();$('bookingDay').innerHTML=meta.dates.map((d,i)=>'<option value="'+i+'">Day '+(i+1)+'｜'+esc(d)+'</option>').join('');const x=bookings.find(v=>v.id===id);$('bookingHeading').textContent=x?'編輯預約':'新增預約';$('bookingId').value=x?.id||'';$('bookingRev').value=x?.rev||'';$('bookingDay').value=x?.day??active;$('bookingTitle').value=x?.title||'';$('bookingStatus').value=x?.status||'尚未預約';$('bookingUrl').value=x?.url||'';$('bookingNote').value=x?.note||'';$('bookingDialog').showModal()}
async function write(kind,id,rev,data){requireEdit();validate(kind,data);
  if(!id){const ref=doc(collection(db,trip,kind));const batch=writeBatch(db);batch.set(ref,{...data,rev:1});await batch.commit();return}
  const ref=doc(db,trip,kind,id);
  await runTransaction(db,async tx=>{const current=await tx.get(ref);if(!current.exists()||current.data().rev!==rev)throw Error('這筆資料已被其他團員修改。請關閉編輯視窗，查看最新內容後再編輯。');tx.update(ref,{...data,rev:rev+1})});
}
async function remove(kind,id,rev){requireEdit();const ref=doc(db,trip,kind,id);await runTransaction(db,async tx=>{const current=await tx.get(ref);if(!current.exists()||current.data().rev!==rev)throw Error('這筆資料已被其他團員修改。請重新確認後再刪除。');tx.delete(ref)})}
$('addItem').onclick=()=>openItem();$('addRestaurant').onclick=()=>openItem(undefined,'food');$('addBooking').onclick=()=>openBooking();
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$('editForm').onsubmit=async e=>{e.preventDefault();const id=$('editId').value;const data={category:$('itemCategory').value,day:Number($('itemDay').value),time:$('itemTime').value.trim()||'待定',title:$('itemTitle').value.trim(),location:$('itemLocation').value.trim(),desc:$('itemDesc').value.trim()};if(!data.title)return;if(looksLikeUrl(data.location)&&!directMapUrl(data.location)){alert('請貼上有效的 Google Maps 連結，或改填地點名稱。');return}try{await write('items',id,Number($('editRev').value),data);active=data.day;$('editDialog').close()}catch(err){alert('無法儲存：'+err.message)}};
$('bookingForm').onsubmit=async e=>{e.preventDefault();const id=$('bookingId').value;const data={day:Number($('bookingDay').value),title:$('bookingTitle').value.trim(),status:$('bookingStatus').value,url:$('bookingUrl').value.trim(),note:$('bookingNote').value.trim()};if(!data.title)return;try{await write('bookings',id,Number($('bookingRev').value),data);active=data.day;$('bookingDialog').close()}catch(err){alert('無法儲存：'+err.message)}};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-day],[data-edit],[data-delete],[data-bookedit],[data-bookdelete]');if(!b)return;if(b.dataset.day!==undefined){active=Number(b.dataset.day);render();return}if(b.dataset.edit)return openItem(b.dataset.edit);if(b.dataset.bookedit)return openBooking(b.dataset.bookedit);const kind=b.dataset.delete?'items':'bookings',id=b.dataset.delete||b.dataset.bookdelete,x=(kind==='items'?items:bookings).find(v=>v.id===id);if(x&&confirm('確定刪除？'))try{await remove(kind,id,x.rev)}catch(err){alert('無法刪除：'+err.message)}});
$('export').onclick=()=>download({version:2,metadata:meta,items:items.map(({id,rev,...x})=>({id,...x})),bookings:bookings.map(({id,rev,...x})=>({id,...x}))},'trip-shared-backup.json');
$('setupImport').onclick=()=>$('setupFile').click();$('dataImport').onclick=()=>$('dataFile').click();
$('setupFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{requireEdit();const data=JSON.parse(await f.text()),m=data.metadata;if(meta)throw Error('旅程設定已存在');if(!validMeta(m))throw Error('設定檔格式不正確');if(confirm('匯入私人旅程的日期與每日說明？')){const ref=doc(db,trip,'meta','main');await runTransaction(db,async tx=>{if((await tx.get(ref)).exists())throw Error('旅程設定已由其他團員建立');tx.set(ref,m)})}}catch(err){alert('無法匯入：'+err.message)}e.target.value=''};
$('dataFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{
requireEdit();const d=JSON.parse(await f.text());if(!meta)throw Error('請先匯入旅程設定');
if(!Array.isArray(d.items)||!Array.isArray(d.bookings)||d.items.length+d.bookings.length+items.length+bookings.length>450)throw Error('備份格式或筆數不正確（合計最多 450 筆）');
const normalized={items:d.items.map(x=>({category:itemCategory(x),day:x.day,time:x.time||'待定',title:x.title,location:x.location||'',desc:x.desc||''})),bookings:d.bookings.map(x=>({day:x.day,title:x.title,status:x.status||'待確認',url:x.url||'',note:x.note||''}))};
for(const kind of ['items','bookings'])normalized[kind].forEach(x=>validate(kind,x));
if(!confirm('將以備份取代共用的 '+items.length+' 項行程與 '+bookings.length+' 項預約，所有團員都會同步。請先匯出備份。確定繼續？'))return;
const previous=[...items.map(x=>({kind:'items',...x})),...bookings.map(x=>({kind:'bookings',...x}))];
const control=doc(db,trip,'import','main');const marker=await getDoc(control);const expected=marker.exists()?marker.data().rev||0:0;
await runTransaction(db,async tx=>{
const current=await tx.get(control);if((current.exists()?current.data().rev||0:0)!==expected)throw Error('其他團員正在匯入，請重試');
const refs=previous.map(x=>doc(db,trip,x.kind,x.id));const snapshots=[];for(const ref of refs)snapshots.push(await tx.get(ref));
snapshots.forEach((s,i)=>{if(!s.exists()||s.data().rev!==previous[i].rev)throw Error('共用資料已變更，請重新匯出並確認後匯入')});
refs.forEach(ref=>tx.delete(ref));for(const kind of ['items','bookings'])for(const x of normalized[kind])tx.set(doc(collection(db,trip,kind)),{...x,rev:1});
tx.set(control,{done:true,rev:expected+1});
});status('備份已還原並同步。');
}catch(err){alert('無法匯入：'+err.message)}finally{e.target.value=''}};
</script></body></html>

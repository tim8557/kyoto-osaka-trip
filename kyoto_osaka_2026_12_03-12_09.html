    {id:'n25',day:5,time:'09:00',title:'大阪城',location:'Osaka Castle',desc:''},
    {id:'n26',day:5,time:'晚上',title:'梅田逛街',location:'Umeda Osaka',desc:'PDF 註明晚上可以去梅田逛街。'},

const key='kyoto-osaka-planner-v2';
const oldKey='kyoto-osaka-planner-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=x=>JSON.parse(JSON.stringify(x));
const safeUrl=value=>{try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const validDay=x=>Number.isInteger(x)&&x>=0&&x<dates.length;
function validData(d){return d&&Array.isArray(d.items)&&Array.isArray(d.bookings)&&d.items.every(x=>x&&typeof x.id==='string'&&validDay(x.day)&&typeof x.title==='string')&&d.bookings.every(x=>x&&typeof x.id==='string'&&validDay(x.day)&&typeof x.title==='string')}
let state=clone(seed),active=0,storageAvailable=true,oldData=null;
try{
  const saved=localStorage.getItem(key);
  if(saved){const parsed=JSON.parse(saved);if(validData(parsed))state={items:parsed.items,bookings:parsed.bookings};else throw Error('新版儲存格式不正確')}
  oldData=localStorage.getItem(oldKey);
}catch(err){storageAvailable=false;console.warn('行程儲存資料無法讀取',err)}
function download(data,name){const url=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function save(){try{localStorage.setItem(key,JSON.stringify({version:2,...state}));storageAvailable=true}catch{storageAvailable=false}render()}
function dateLabel(i){return `${Number(dates[i].slice(5,7))}/${Number(dates[i].slice(8))}`}
function directMapUrl(value){
  const input=String(value??'').trim();
  const candidate=/^https?:\/\//i.test(input)?input:/^(?:www\.|maps\.|google\.|goo\.)/i.test(input)?'https://'+input:'';
  if(!candidate)return '';
  try{
    const url=new URL(candidate);
    const host=url.hostname.toLowerCase();
    const google= /^(?:www\.)?google\.(?:com|com\.[a-z]{2}|co\.[a-z]{2}|[a-z]{2})$/.test(host);
    const allowed=(google&&url.pathname.startsWith('/maps'))||(host==='maps.google.com')||(host==='maps.app.goo.gl')||(host==='goo.gl'&&url.pathname.startsWith('/maps/'));
    if(!allowed)return '';
    url.protocol='https:';
    return url.href;
  }catch{return ''}
}
function looksLikeUrl(value){return /^(?:[a-z][a-z\d+.-]*:|(?:www\.|maps\.|google\.|goo\.)\S*\/)/i.test(String(value??'').trim())}
function mapUrl(loc){const input=String(loc??'').trim();if(!input)return '';return directMapUrl(input)||(looksLikeUrl(input)?'':'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(input))}
function timeOrder(value){
  const time=String(value??'').trim();
  const match=time.match(/^(?:約\s*)?(\d{1,2}):([0-5]\d)/);
  if(match&&Number(match[1])<24)return Number(match[1])*60+Number(match[2]);
  const periods={清晨:300,早上:480,上午:540,中午:720,下午:900,傍晚:1020,晚上:1140};
  return periods[time]??Infinity;
}
function render(){
  $('days').innerHTML='<h3>每日行程</h3>'+dates.map((d,i)=>`<button class="daytab ${i===active?'active':''}" data-day="${i}">Day ${i+1} · ${dateLabel(i)}<small>${esc(titles[i])}</small></button>`).join('');
  $('dayTitle').textContent=`Day ${active+1}｜${titles[active]}`;
  $('dayDate').textContent=dates[active]+'（'+['四','五','六','日','一','二','三'][active]+'）';
  $('dayNote').textContent=notes[active];
  const items=state.items.filter(x=>x.day===active).map((item,index)=>({item,index})).sort((a,b)=>timeOrder(a.item.time)-timeOrder(b.item.time)||a.index-b.index).map(x=>x.item);
  $('count').textContent=items.length+' 項行程';
  $('timeline').innerHTML=items.length?items.map(x=>`<article class="item"><div class="time">${esc(x.time||'待定')}</div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><div class="itemactions">${mapUrl(x.location)?`<a class="link" href="${esc(mapUrl(x.location))}" target="_blank" rel="noopener noreferrer">↗ 地圖導航</a>`:''}<button class="link" data-edit="${esc(x.id)}">編輯</button><button class="link" data-delete="${esc(x.id)}">刪除</button></div></article>`).join(''):'<div class="empty">這天尚未安排，點選「新增行程」開始規劃。</div>';
  const bs=state.bookings.filter(x=>x.day===active);
  $('bookingCount').textContent=bs.length+' 項';
  $('bookings').innerHTML=bs.length?bs.map(b=>`<div class="bookrow"><div><strong>${esc(b.title)}</strong><small>${esc(b.note)} ${safeUrl(b.url)?`<a href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener noreferrer">開啟預約連結 ↗</a>`:''}</small></div><span class="status ${b.status==='已預約'?'done':''}">${esc(b.status)}</span><div><button class="link" data-bookedit="${esc(b.id)}">編輯</button> <button class="link" data-bookdelete="${esc(b.id)}">刪除</button></div></div>`).join(''):'<div class="empty">這天尚無預約記錄。</div>';
  $('storageNotice').hidden=storageAvailable;
}
for(const id of ['itemDay','bookingDay'])$(id).innerHTML=dates.map((d,i)=>`<option value="${i}">Day ${i+1}｜${d}</option>`).join('');
if(oldData){$('legacyNotice').hidden=false;$('legacyExport').hidden=false}
function openItem(id){const x=state.items.find(v=>v.id===id);$('editHeading').textContent=x?'編輯行程':'新增行程';$('editId').value=x?.id||'';$('itemDay').value=x?.day??active;$('itemTime').value=x?.time||'';$('itemTitle').value=x?.title||'';$('itemLocation').value=x?.location||'';$('itemDesc').value=x?.desc||'';$('editDialog').showModal()}
function openBooking(id){const x=state.bookings.find(v=>v.id===id);$('bookingHeading').textContent=x?'編輯預約':'新增預約';$('bookingId').value=x?.id||'';$('bookingDay').value=x?.day??active;$('bookingTitle').value=x?.title||'';$('bookingStatus').value=x?.status||'尚未預約';$('bookingUrl').value=x?.url||'';$('bookingNote').value=x?.note||'';$('bookingDialog').showModal()}
$('addItem').onclick=()=>openItem();$('addBooking').onclick=()=>openBooking();
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).close());
$('editForm').onsubmit=e=>{e.preventDefault();const id=$('editId').value;const item={id:id||uid(),day:Number($('itemDay').value),time:$('itemTime').value.trim()||'待定',title:$('itemTitle').value.trim(),location:$('itemLocation').value.trim(),desc:$('itemDesc').value.trim()};if(!item.title)return;if(looksLikeUrl(item.location)&&!directMapUrl(item.location)){alert('請貼上有效的 Google Maps 連結，或改填地點名稱。');$('itemLocation').focus();return}state.items=id?state.items.map(x=>x.id===id?item:x):[...state.items,item];active=item.day;$('editDialog').close();save()};
$('bookingForm').onsubmit=e=>{e.preventDefault();const id=$('bookingId').value;const b={id:id||uid(),day:Number($('bookingDay').value),title:$('bookingTitle').value.trim(),status:$('bookingStatus').value,url:$('bookingUrl').value.trim(),note:$('bookingNote').value.trim()};if(!b.title)return;state.bookings=id?state.bookings.map(x=>x.id===id?b:x):[...state.bookings,b];active=b.day;$('bookingDialog').close();save()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-day],[data-edit],[data-delete],[data-bookedit],[data-bookdelete]');if(!b)return;if(b.dataset.day!==undefined){active=Number(b.dataset.day);render()}else if(b.dataset.edit)openItem(b.dataset.edit);else if(b.dataset.bookedit)openBooking(b.dataset.bookedit);else if(b.dataset.delete&&confirm('確定刪除此行程？')){state.items=state.items.filter(x=>x.id!==b.dataset.delete);save()}else if(b.dataset.bookdelete&&confirm('確定刪除此預約？')){state.bookings=state.bookings.filter(x=>x.id!==b.dataset.bookdelete);save()}});
$('export').onclick=()=>download(JSON.stringify({version:2,...state},null,2),'kyoto-osaka-2026-12-backup.json');
$('legacyExport').onclick=()=>{if(oldData)download(oldData,'kyoto-osaka-legacy-v1-backup.json')};
$('importBtn').onclick=()=>$('file').click();
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!validData(d))throw Error('備份格式不正確，或日期不在 12/3–12/9');if(confirm('匯入會覆蓋目前的新版行程與預約。建議先匯出目前備份。確定匯入嗎？')){state={items:d.items,bookings:d.bookings};save()}}catch(err){alert('無法匯入：'+err.message)}e.target.value=''};
$('reset').onclick=()=>{if(confirm('確定還原 PDF 初始行程？目前編輯將被覆蓋，建議先匯出備份。')){state=clone(seed);save()}};
render();
</script></body></html>
